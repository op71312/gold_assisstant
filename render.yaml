services:
  - type: web
    name: gold-assistant-gaib
    runtime: python
    plan: standard
    buildCommand: python -m pip install -r web/python/requirements.txt
    startCommand: uvicorn web.python.gaib_runtime:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GAIB_SERVICE_TOKEN
        sync: false
      - key: THAILLM_API_KEY1
        sync: false
      - key: THAILLM_API_KEY2
        sync: false
      - key: THAILLM_API_KEY3
        sync: false
      - key: THAILLM_API_KEY4
        sync: false
      - key: THAILLM_API_KEY5
        sync: false
      - key: THAILLM_API_KEY6
        sync: false
      - key: THAILLM_API_KEY7
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: JINA_API_KEY2
        sync: false
      - key: JINA_API_KEY3
        sync: false
      - key: JINA_API_KEY4
        sync: false
